[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Privacy-preserving local LLM agent with persistent memory, RAG, and tool calling"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["aegis*"]